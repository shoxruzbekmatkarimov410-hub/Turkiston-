<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1240px;margin:0 auto;padding:16px 20px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}

button{cursor:pointer}
button.pri{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
.login{max-width:380px;margin:8vh auto 0;display:grid;gap:12px}
.err{color:var(--bad);min-height:1.4em;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.badge{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;color:var(--mut)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.filters .q{grid-column:1/-1}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:10px;align-items:start}
.list details{margin-top:0}
.row{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel);padding:12px}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#0e1a2b}
.big .av{width:84px;height:84px;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{color:var(--mut)}dd{margin:0}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:13px;margin:2px 4px 2px 0}
.hide{color:var(--mut);font-style:italic}
.note{font-size:13px;color:var(--mut);margin-top:16px}
.nav{display:flex;gap:6px;margin-bottom:14px}

.nav button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
.gr{width:100%;height:auto;max-height:80vh;display:block;margin:0 auto}
.gt{fill:var(--tx);font-size:11px;text-anchor:middle}
.gl{fill:var(--mut);font-size:9px;text-anchor:middle}
.ge{stroke:var(--mut);stroke-width:1.5}
.gn{cursor:pointer}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px}
summary{cursor:pointer;min-height:24px}
.st{float:right}
.top{flex-wrap:wrap}
.hd{display:flex;align-items:center;gap:10px}
.hd small{display:block;color:var(--mut);font-size:12px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
button .ic{margin-right:6px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:10px;align-items:start}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.ags{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.ag{display:grid;justify-items:center;gap:6px;width:104px;text-align:center;font-size:12px;color:var(--mut);cursor:pointer}
.ag .box{width:72px;height:72px;border:1.5px dashed var(--line);border-radius:50%;display:grid;place-items:center;overflow:hidden}
.ag .ic{width:30px;height:30px;margin:0}
.ag img{width:100%;height:100%;object-fit:contain}
.ag input,.up input{display:none}
.ths{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.ths img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.up{display:inline-flex;align-items:center;min-height:44px;padding:10px 12px;border:1px dashed var(--ac);border-radius:8px;cursor:pointer;margin-right:8px}
.nav{overflow-x:auto}.nav button{white-space:nowrap;flex:1 0 auto}
.bar{height:8px;background:var(--line);border-radius:4px}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.ph{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--ac)}
#lg{padding:6px 10px;min-height:36px}
body{background:radial-gradient(circle at 15% -10%,rgba(217,178,76,.10),transparent 45%),var(--bg)}
h1,h2{font-family:Georgia,"Times New Roman",serif;letter-spacing:.01em}
.cls{background:var(--ac);color:var(--ac2);text-align:center;font-size:11px;font-weight:700;letter-spacing:.14em;padding:5px 8px}
.login{border-top:3px solid var(--ac)}
.card{box-shadow:0 8px 24px rgba(0,0,0,.16)}
.row{transition:border-color .15s,transform .15s}.row:hover{border-color:var(--ac);transform:translateY(-1px)}
.top{padding-bottom:12px;border-bottom:1px solid var(--line)}
.foot{max-width:1200px;margin:28px auto 16px;padding-top:12px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--mut)}
@media print{:root{--bg:#fff;--panel:#fff;--tx:#000;--mut:#444;--line:#999}.nav,.top,.up,#pr,.note,.ags{display:none}}

:root{--p:var(--panel);--l:var(--line);--m:var(--mut);--a2:var(--ac2);--ok:#3fb27f;--wn:#e0a23a;--bd:var(--bad)}
@media(prefers-color-scheme:light){:root{--ok:#1d7a52;--wn:#9a6a08}}
.cn{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.cn button{white-space:nowrap;padding:8px 12px}
.cn .on{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
.c{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:16px;margin-top:12px}
.m{color:var(--m)}.res{border-left:6px solid var(--l)}
.cv input,.cv select,.cv textarea{width:100%}
.cv textarea{min-height:110px;resize:vertical;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.cv label{display:block;margin-top:10px}.cv label.k{display:flex;gap:10px;align-items:center}.cv label.k input{width:22px;min-height:22px}
.tw{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.tw{grid-template-columns:1fr}}
.map{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.map button{width:100%;min-height:68px;padding:4px;font-size:12px}
</style>
</head>

function filtered(){
  const q=S.q.toLowerCase(),t=nl(S.q),city=S.city||t.city,crime=S.crime||t.crime,mn=S.hmin||t.min,mx=S.hmax||t.max;

const nm=id=>{const p=P.find(x=>x.id===id);return p?p.name:X.find(x=>x.id===id).l;};

function graph(foc){
  S.view="graph";
  const pos={};
  P.forEach((p,i)=>{const a=i/P.length*6.283-1.57;pos[p.id]=[200+150*Math.cos(a),200+150*Math.sin(a)];});
  X.forEach((x,i)=>{const a=i/X.length*6.283-.5;pos[x.id]=[200+55*Math.cos(a),200+55*Math.sin(a)];});
  const near=new Set([foc]);
  E.forEach(e=>{if(e[0]===foc||e[1]===foc){near.add(e[0]);near.add(e[1]);}});
  const hit=e=>!foc||e[0]===foc||e[1]===foc;
  const lines=E.map(e=>{const a=pos[e[0]],b=pos[e[1]];return `<line class="ge" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" opacity="${hit(e)?(foc?1:.55):.1}"/>`+(foc&&hit(e)?`<text class="gl" x="${(a[0]+b[0])/2}" y="${(a[1]+b[1])/2-3}">${e[2]}</text>`:"");}).join("");
  const nodes=[...P,...X].map(n=>{const c=pos[n.id],p=!!n.name,dim=foc&&!near.has(n.id);
    return `<g class="gn" data-id="${n.id}" opacity="${dim?.25:1}"><circle cx="${c[0]}" cy="${c[1]}" r="${p?16:11}" style="fill:${p?col(n.name):"var(--panel)"};stroke:var(--ac);stroke-width:${n.id===foc?4:1.5}"/><text class="gt" x="${c[0]}" y="${c[1]+(p?30:24)}">${p?n.name.split(" ")[0]:n.l}</text></g>`;}).join("");
  const info=foc?E.filter(hit).map(e=>`<dl><dt>${e[2]}</dt><dd>${nm(e[0])} ↔ ${nm(e[1])}</dd></dl>`).join("")+(P.find(p=>p.id===foc)?`<button class="pri" id="od" style="margin-top:10px">Dosyeni ochish</button>`:""):`<span class="mut">Tugunni bosing: aloqalari ajralib koʻrinadi.</span>`;
  app.innerHTML=bar()+`<div class="two"><div class="card"><h3>Aloqalar xaritasi</h3><svg class="gr" viewBox="0 0 400 400">${lines}${nodes}</svg></div><div class="card">${info}</div></div><div class="note">Uydirma maʼlumot. Katta doira: shaxs. Kichik doira: telefon, manzil, hisob.</div>`;
  bindOut();
  document.querySelectorAll(".gn").forEach(g=>g.onclick=()=>graph(g.dataset.id===foc?null:g.dataset.id));
  const od=$("#od");if(od)od.onclick=()=>dossier(foc);
}

function scan(t){
  const R=[];let s=0;const add=(n,m)=>{s+=n;R.push(m);};
  const urls=t.match(/(?:https?:\/\/)?(?:[\w-]+\.)+[a-z]{2,}(?:\/\S*)?/gi)||[];
  urls.slice(0,3).forEach(u=>{
    let h;try{h=new URL(/^https?:/i.test(u)?u:"http://"+u);}catch(e){return;}
    const host=h.hostname.toLowerCase();
    if(/^http:\/\//i.test(u))add(1,host+": xavfsiz ulanish (https) yoʻq");
    if(/^\d+\.\d+\.\d+\.\d+$/.test(host))add(2,"Manzil raqamlardan iborat (IP)");
    if(host.includes("xn--"))add(2,"Xorijiy belgilar bilan yozilgan domen (taqlid boʻlishi mumkin)");
    if(u.includes("@"))add(2,"Havolada @ belgisi bor");
    if(host.split(".").length>3||(host.match(/-/g)||[]).length>1)add(1,host+": domen juda uzun yoki koʻp chiziqchali");
    if(BADTLD.some(x=>host.endsWith(x)))add(1,host+": domen zonasi koʻp firibgarlikda uchraydi");
    if(SH.includes(host))add(1,"Qisqartirilgan havola: haqiqiy manzil yashirin");
    const off=OFF.some(o=>host===o||host.endsWith("."+o));
    if(!off&&BR.some(b=>host.includes(b)))add(3,host+": mashhur xizmat nomiga oʻxshaydi, lekin rasmiy domen emas");
  });
  const x=t.toLowerCase().replace(/[ʻʼ’'`‘]/g,"");
  const hit=KW.filter(k=>x.includes(k));
  if(hit.length)add(Math.min(hit.length,3),"Xavfli soʻzlar: "+hit.join(", "));
  return {s,R};
}

function vPriv(){return `<div class="c"><h3>Maxfiylik va ma\u02bclumotlar</h3><ul><li>Parol va karta ma\u02bclumotlari yig\u02bbilmaydi.</li><li>Xabar berishda ism ko\u02bbrsatish ixtiyoriy.</li><li>Skrinshotdagi telefon, manzil va ismni yashiring.</li><li>Tekshirilmagan xabar ommaga chiqmaydi.</li><li>Saqlash muddati tugagach ma\u02bclumot o\u02bbchiriladi (muddat haqiqiy tizimda belgilanadi).</li><li>Istalgan vaqtda ma\u02bclumotlaringizni o\u02bbchirishni so\u02bbrashingiz mumkin.</li><li>Xavfsizlik hodisasi bo\u02bblsa, foydalanuvchilarga xabar beriladi.</li></ul><h3 style="margin-top:14px">Bizda boʻlmaydi</h3><ul><li>Foydalanuvchi telefonini yashirin kuzatish</li><li>Xabar va qoʻngʻiroqlarni roziliksiz oʻqish</li><li>Boshqa tizimlarga ruxsatsiz kirish</li><li>Odamlarni avtomatik “xavfli” deb belgilash</li><li>Tekshirilmagan shikoyatlarni ommaga chiqarish</li></ul><button id="wipe">Mening ma\u02bclumotlarimni o\u02bbchirish</button><p id="wm" class="m"></p></div>`;}
function bPriv(){$("#wipe").onclick=()=>{HIST=[];RP=[];aud("Foydalanuvchi ma\u02bclumotlarini o\u02bbchirdi");$("#wm").textContent="Tekshiruv tarixi va xabarlaringiz o\u02bbchirildi (demo).";};}
function vContact(){const adm=S.user.role==="admin";return `<div class="c"><h3>Aloqa va fikr-mulohaza</h3><label>Ism (ixtiyoriy)<input id="fn"></label><label>Telegram yoki pochta (ixtiyoriy)<input id="fc"></label><label>Fikringiz<textarea id="fm"></textarea></label><div id="fe" style="color:var(--bd);min-height:1.4em"></div><button class="p" id="fs">Yuborish</button></div>${adm?`<div class="c"><h3>Kelgan fikrlar (${FB.length})</h3>${FB.length?FB.map(f=>`<div style="border-top:1px solid var(--l);padding:8px 0"><b>${esc(f.n||"Anonim")}</b> <span class="m">${esc(f.c)}</span><div>${esc(f.m)}</div></div>`).join(""):`<p class="m">Hali yo\u02bbq.</p>`}</div>`:""}`;}
function bContact(){$("#fs").onclick=()=>{const m=$("#fm").value.trim();if(m.length<5){$("#fe").textContent="Kamida 5 belgi yozing.";return;}FB.unshift({n:$("#fn").value.trim(),c:$("#fc").value.trim(),m});aud("Fikr-mulohaza yuborildi");render();};}
function vReportFull(){
  const pub=RP.filter(x=>x.st==="Tasdiqlandi");
  return `<div class="c"><h3>Firibgarlik haqida xabar bering</h3><p class="m">Telefon, ism va karta maʼlumotlarini yashiring. Xabaringiz moderator tekshirgandan keyingina ommaga chiqadi.</p>
  <div class="tw"><label>Turi<select id="rt"><option>Shubhali SMS</option><option>Telegram akkaunt</option><option>Sayt</option><option>Qoʻngʻiroq</option><option>Boshqa</option></select></label><label>Hudud<select id="rh">${REG.map(r=>`<option>${r}</option>`).join("")}</select></label></div>
  <label>Havola yoki raqam (ixtiyoriy)<input id="rl"></label><label>Nima boʻldi?<textarea id="rd"></textarea></label><label>Skrinshot (ixtiyoriy)<input id="rf" type="file" accept="image/*"></label>
  <div id="re" style="color:var(--bd);min-height:1.4em;margin-top:8px"></div><button class="p" id="rs">Yuborish</button></div>
  <div class="c"><h3>Xabarlar (${RP.length})</h3>${RP.length?RP.map((x,i)=>`<div style="border-top:1px solid var(--l);padding:10px 0"><span class="tag">${x.t}</span><span class="tag">${x.h}</span><span class="tag" style="color:var(--ac)">${x.st}</span><p style="margin:6px 0">${esc(x.d)}</p>${x.img?`<img src="${x.img}" alt="skrinshot" style="width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`:""}${x.l?`<div class="m">${esc(x.l)}</div>`:""}${(S.user.role==="admin")?["Tekshirilmoqda","Tasdiqlandi","Tasdiqlanmadi"].map(s=>`<button data-i="${i}" data-s="${s}" style="margin:6px 6px 0 0">${s}</button>`).join(""):""}</div>`).join(""):`<p class="m">Hali xabar yoʻq.</p>`}${(S.user.role==="admin")?`<p class="m">Moderator: shikoyatni tekshirmasdan hech kimni aybdor deb eʼlon qilmang.</p>`:""}</div>
  <div class="c"><h3>Tasdiqlangan ogohlantirishlar</h3>${pub.length?pub.map(x=>`<p><span class="tag">${x.t}</span>${esc(x.d)}</p>`).join(""):`<p class="m">Hozircha yoʻq. Admin (moderator) sifatida kirib, xabarni “Tasdiqlandi” qiling.</p>`}</div>`;
}
function bReportFull(){
  $("#rs").onclick=()=>{const d=$("#rd").value.trim(),l=$("#rl").value.trim();
    if(d.length<10){$("#re").textContent="Kamida 10 belgilik tavsif yozing.";return;}
    if(/\b(?:\d[ -]?){16}\b/.test(d+" "+l)){$("#re").textContent="Karta raqami topildi. Uni oʻchirib tashlang.";return;}
    const fl=$("#rf").files[0],go2=img=>{aud("Firibgarlik xabari yuborildi");RP.unshift({t:$("#rt").value,h:$("#rh").value,l,d,st:"Yangi",img});render();};fl?readImg(fl,go2):go2();};
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{RP[+b.dataset.i].st=b.dataset.s;render();});
}
function vGuide(){return G.map(g=>`<details><summary>${g[0]}</summary><ul>${g[1].map(x=>`<li>${x}</li>`).join("")}</ul></details>`).join("");}
function vQuiz(){
  if(QI>=Q.length)return `<div class="c"><h3>Natija: ${QS} / ${Q.length}</h3><p class="m">${QS>=4?"Ajoyib, firibgarlik belgilarini yaxshi taniysiz.":"Yana urinib koʻring va qoʻllanmani oʻqing."}</p><button class="p" id="rq">Qayta boshlash</button></div>`;
  const q=Q[QI];
  return `<div class="c"><span class="tag">${QI+1} / ${Q.length}</span><p style="font-size:17px">“${esc(q.t)}”</p>${QA===null?`<button id="y">Firibgarlik</button> <button id="n">Xavfsiz</button>`:`<p><b style="color:var(--${QA===q.s?"ok":"bd"})">${QA===q.s?"Toʻgʻri":"Notoʻgʻri"}.</b> ${q.w}</p><button class="p" id="nx">Keyingisi</button>`}</div><p class="m" style="font-size:12px">Namunalar uydirma, haqiqiy havola yoʻq.</p>`;
}
function bQuiz(){const a=v=>()=>{QA=v;if(v===Q[QI].s)QS++;render();};
  if($("#y")){$("#y").onclick=a(true);$("#n").onclick=a(false);}
  if($("#nx"))$("#nx").onclick=()=>{QI++;QA=null;render();};
  if($("#rq"))$("#rq").onclick=()=>{QI=0;QS=0;QA=null;render();};}
function vOrg(){const n=OA.filter(Boolean).length,m=n>=5?["Yaxshi himoya","ok"]:n>=3?["Oʻrtacha: qolganlariga eʼtibor bering","wn"]:["Zaif: avval ikki bosqichli tasdiqlash va zaxira nusxani yoqing","bd"];
  return `<div class="c"><h3>Kichik tashkilot uchun tekshiruv ro‘yxati</h3><p class="m">Oʻzini-oʻzi tekshirish. Hech qanday tizimga kirish talab qilinmaydi.</p>${OQ.map((q,i)=>`<label class="k"><input type="checkbox" data-o="${i}" ${OA[i]?"checked":""}>${q}</label>`).join("")}</div><div class="c res" style="border-left-color:var(--${m[1]})"><h3 style="color:var(--${m[1]})">${n} / ${OQ.length}</h3>${m[0]}</div>`;}
function bOrg(){document.querySelectorAll("[data-o]").forEach(c=>c.onchange=()=>{OA[+c.dataset.o]=c.checked;render();});}
function vMap(){const mx=Math.max(...REG.map((_,i)=>cnt(i)));
  return `<div class="c"><h3>Hududlar bo‘yicha ogohlantirishlar</h3><p class="m">Sxema: viloyatlarning taxminiy joylashuvi. Qanchalik toʻq, shunchalik koʻp tasdiqlangan ogohlantirish. Namunaviy maʼlumot.</p><div class="map">${REG.map((r,i)=>`<button data-r="${i}" style="grid-column:${POS[i][0]+1};grid-row:${POS[i][1]+1};background:rgba(217,178,76,${(.12+.7*cnt(i)/mx).toFixed(2)})">${r}<br><b>${cnt(i)}</b></button>`).join("")}</div><p id="mi" class="m" style="margin-top:12px">Viloyatni bosing.</p></div>`;}
function bMap(){document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const i=+b.dataset.r;$("#mi").textContent=REG[i]+": "+cnt(i)+" ta tasdiqlangan ogohlantirish.";});}
function vReport(){const f=vReportFull();if(S.user.role!=="mehmon")return f;const pub=RP.filter(x=>x.st==="Tasdiqlandi");return `<div class="c"><h3>Tasdiqlangan ogohlantirishlar</h3>${pub.length?pub.map(x=>`<p><span class="tag">${x.t}</span>${esc(x.d)}</p>`).join(""):`<p class="m">Hozircha yo\u02bbq.</p>`}<p class="m">Xabar berish uchun ro\u02bbyxatdan o\u02bbting.</p></div>`;}
function bReport(){if(S.user.role!=="mehmon")bReportFull();}
const CT=()=>S.user.role==="mehmon"?CTABS.filter(t=>["guide","quiz","report","map","priv","contact"].includes(t[0])):CTABS;
function reg(msg){
  app.innerHTML=`<div class="card login"><div style="text-align:center">${LOGO(64)}<h1>Ro\u02bbyxatdan o\u02bbtish</h1><div class="mut">Demo: ma\u02bclumot faqat sahifa ochiq turganda saqlanadi.</div></div><input id="rn" placeholder="Ism"><input id="rl2" placeholder="Login" autocomplete="off"><input id="rp" type="password" placeholder="Parol (kamida 6 belgi)"><div class="err" id="e">${msg||""}</div><button class="pri" id="rok">Ro\u02bbyxatdan o\u02bbtish</button><button id="rb">Orqaga</button></div>`;
  $("#rb").onclick=()=>login();
  $("#rok").onclick=()=>{const l=$("#rl2").value.trim().toLowerCase(),n=$("#rn").value.trim(),p=$("#rp").value;
    if(!n||!l||p.length<6)return reg("Ism, login va kamida 6 belgili parol kerak.");
    if(USERS[l])return reg("Bu login band.");
    USERS[l]={pw:p,role:"fuqaro",name:n};S.user=USERS[l];aud("Ro\u02bbyxatdan o\u02bbtdi");civ("check");};
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){civ();}
let CV="check";
function civ(v){
  if(typeof v==="string")CV=v;
  S.view="civ";
  const B={check:vCheck,report:vReport,guide:vGuide,quiz:vQuiz,org:vOrg,map:vMap,priv:vPriv,contact:vContact}[CV]();
  app.innerHTML=bar()+`<div class="cn">${CT().map(t=>`<button data-c="${t[0]}" class="${CV===t[0]?"on":""}">${t[1]}</button>`).join("")}</div><div class="cv">${B}<p class="m" style="font-size:12px;margin-top:24px">Bu ogohlantirish vositasi, kafolatli hukm emas. Parol va karta maʼlumotlarini hech qayerga kiritmang.</p></div>`;
  bindOut();
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>civ(b.dataset.c));
  ({check:bCheck,report:bReport,quiz:bQuiz,org:bOrg,map:bMap,priv:bPriv,contact:bContact}[CV]||(()=>{}))();
}
IC.civ=IC.shield;IC.adm=IC.list;
let AR=[],XN=0;
function acc(msg){
  app.innerHTML=`<div class="card login"><div style="text-align:center">${LOGO(64)}<h1>Xodim hisobi uchun ariza</h1><div class="mut">Davlat va xavfsizlik idoralari xodimlari uchun. Ariza tekshiriladi, toʻlov tasdiqlangach login va parol beriladi.</div></div><input id="an" placeholder="Ism-familiya"><input id="ao" placeholder="Idora yoki tashkilot"><input id="ap" placeholder="Lavozim"><input id="ac" placeholder="Rasmiy pochta yoki telefon"><select id="at"><option>Oylik obuna</option><option>Yillik obuna</option></select><div class="note">Narx va toʻlov usuli ariza tekshirilgach aytiladi. Demo: haqiqiy toʻlov yoʻq.</div><div class="err" id="e">${msg||""}</div><button class="pri" id="aok">Ariza yuborish</button><button id="ab">Orqaga</button></div>`;
  $("#ab").onclick=()=>login();
  $("#aok").onclick=()=>{const v=k=>$("#"+k).value.trim();
    if(!v("an")||!v("ao")||!v("ac"))return acc("Ism, idora va aloqa maʼlumoti kerak.");
    AR.unshift({n:v("an"),org:v("ao"),pos:v("ap")||"—",ct:v("ac"),plan:$("#at").value,st:"Yangi",tm:new Date().toISOString().slice(0,16).replace("T"," ")});
    aud("Xodim hisobi uchun ariza");
    app.innerHTML=`<div class="card login"><h2>Arizangiz qabul qilindi</h2><p class="mut">Tekshiruv va toʻlovdan keyin login va parol beriladi.</p><button class="pri" id="bk">Bosh sahifaga</button></div>`;
    $("#bk").onclick=()=>{S.user=USERS.mehmon;civ("guide");};};
}
function adm(){
  S.view="adm";
  if(S.user.role!=="admin"){app.innerHTML=bar()+`<div class="card mut">Faqat admin uchun.</div>`;bindOut();return;}
  const st=Object.entries(USERS).filter(([k,u])=>u.role==="tergovchi");
  app.innerHTML=bar()+`<div class="card"><h3>Xodim hisobi arizalari (${AR.length})</h3>${AR.length?AR.map((a,i)=>`<div style="border-top:1px solid var(--line);padding:10px 0"><b>${esc(a.n)}</b> · ${esc(a.org)} · ${esc(a.pos)}<div class="mut">${esc(a.ct)} · ${a.plan} · ${a.tm}</div><span class="tag">${a.st}</span>${a.cred?`<div class="note">Beriladigan hisob: <b>${a.cred}</b></div>`:""}${a.st==="Yangi"?`<div style="margin-top:6px"><button class="pri" data-ok="${i}">Tasdiqlash (toʻlov qabul qilindi)</button> <button data-no="${i}">Rad etish</button></div>`:""}</div>`).join(""):`<p class="mut">Hozircha ariza yoʻq.</p>`}</div><div class="card" style="margin-top:12px"><h3>Faol xodim hisoblari (${st.length})</h3>${st.map(([k,u])=>`<div style="border-top:1px solid var(--line);padding:8px 0">${esc(u.name)} (${esc(k)}) <button data-bl="${k}">Bloklash</button></div>`).join("")||`<p class="mut">Yoʻq.</p>`}</div><div class="note">Demo: haqiqiy tizimda parol shifrlangan holda serverda saqlanadi va toʻlov tizimiga ulanadi.</div>`;
  bindOut();
  document.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{const a=AR[+b.dataset.ok],l="xodim"+(++XN),p=Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>"abcdefghjkmnpqrstuvwxyz23456789"[x%31]).join("");
    USERS[l]={pw:p,role:"tergovchi",name:a.n};a.st="Tasdiqlandi";a.cred=l+" / "+p;aud("Xodim hisobi berildi: "+l);adm();});
  document.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>{AR[+b.dataset.no].st="Rad etildi";aud("Ariza rad etildi");adm();});
  document.querySelectorAll("[data-bl]").forEach(b=>b.onclick=()=>{delete USERS[b.dataset.bl];aud("Hisob bloklandi: "+b.dataset.bl);adm();});
}
foot();S.user=USERS.mehmon;civ("guide");
</script>
</body>
</html>
