<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turkiston Shield — Demo</title>
<style>
:root{--bg:#0e1a2b;--panel:#15243b;--line:#243a5a;--tx:#e8eef8;--mut:#93a4c0;--ac:#4fb3a9;--ac2:#0e1a2b;--bad:#f0716b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--bg:#eef2f8;--panel:#fff;--line:#d3dcea;--tx:#14233a;--mut:#5d6f8c;--ac:#17837a;--ac2:#fff;--bad:#c63d36}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:980px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
.mut{color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{cursor:pointer}
button.pri{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
.login{max-width:380px;margin:8vh auto 0;display:grid;gap:12px}
.err{color:var(--bad);min-height:1.4em;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.badge{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;color:var(--mut)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.filters .q{grid-column:1/-1}
.list{display:grid;gap:8px;margin-top:10px}
.row{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel);padding:12px}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#0e1a2b}
.big .av{width:84px;height:84px;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{color:var(--mut)}dd{margin:0}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:13px;margin:2px 4px 2px 0}
.hide{color:var(--mut);font-style:italic}
.note{font-size:13px;color:var(--mut);margin-top:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const USERS={admin:{pw:"admin123",role:"admin",name:"Administrator"},tergovchi:{pw:"tergov123",role:"tergovchi",name:"Tergovchi"}};
const P=[
{id:"TS-0001",name:"Anvar Karimov",born:"1989-03-14",h:178,city:"Toshkent",addr:"Chilonzor, 9-kvartal, 12-uy",phone:"+998 90 111 22 33",fp:"FP-A91C",veh:[{p:"01 A 123 AA",m:"Chevrolet Gentra, oq"}],marks:"Oʻng qoʻlda yara izi",cv:[{y:2012,t:"Bosqinchilik",d:"3 yil ozodlikdan mahrum"},{y:2019,t:"Firibgarlik",d:"Jarima"}]},
{id:"TS-0002",name:"Bekzod Rahimov",born:"1992-07-02",h:176,city:"Toshkent",addr:"Yunusobod, 4-mavze, 7-uy",phone:"+998 91 222 33 44",fp:"FP-B22D",veh:[{p:"10 B 456 BB",m:"Kia K5, qora"}],marks:"Chap quloqda sirgʻa izi",cv:[{y:2015,t:"Bosqinchilik",d:"2 yil shartli"}]},
{id:"TS-0003",name:"Dilshod Yusupov",born:"1985-11-21",h:181,city:"Samarqand",addr:"Registon koʻchasi, 18-uy",phone:"+998 93 333 44 55",fp:"FP-C33E",veh:[],marks:"Yoʻq",cv:[{y:2010,t:"Oʻgʻrilik",d:"1 yil axloq tuzatish"}]},
{id:"TS-0004",name:"Eldor Tursunov",born:"1995-01-30",h:179,city:"Toshkent",addr:"Sergeli, 3-uy",phone:"+998 94 444 55 66",fp:"FP-D44F",veh:[{p:"01 C 789 CC",m:"Damas, oq"}],marks:"Boʻyinda tatuirovka",cv:[{y:2018,t:"Bosqinchilik",d:"4 yil ozodlikdan mahrum"},{y:2021,t:"Oʻgʻrilik",d:"Jarima"}]},
{id:"TS-0005",name:"Farhod Ismoilov",born:"1990-05-09",h:172,city:"Namangan",addr:"Davlatobod, 21-uy",phone:"+998 95 555 66 77",fp:"FP-E55A",veh:[{p:"40 D 321 DD",m:"Nexia 3, kulrang"}],marks:"Yoʻq",cv:[]},
{id:"TS-0006",name:"Gʻayrat Aliyev",born:"1987-09-17",h:177,city:"Toshkent",addr:"Mirzo Ulugʻbek, 15-uy",phone:"+998 97 666 77 88",fp:"FP-F66B",veh:[{p:"01 E 654 EE",m:"Spark, qizil"}],marks:"Chap qoshda chandiq",cv:[{y:2014,t:"Firibgarlik",d:"2 yil axloq tuzatish"}]},
{id:"TS-0007",name:"Hamid Sodiqov",born:"1993-12-03",h:185,city:"Buxoro",addr:"Navoiy koʻchasi, 5-uy",phone:"+998 99 777 88 99",fp:"FP-G77C",veh:[],marks:"Yoʻq",cv:[{y:2017,t:"Bosqinchilik",d:"3 yil ozodlikdan mahrum"}]},
{id:"TS-0008",name:"Ilyos Normatov",born:"1998-04-25",h:174,city:"Andijon",addr:"Bobur shoh koʻchasi, 30-uy",phone:"+998 88 888 99 00",fp:"FP-H88D",veh:[{p:"60 F 987 FF",m:"Lacetti, qora"}],marks:"Oʻng bilakda tatuirovka",cv:[]}
];
const S={user:null,sel:null,q:"",city:"",hmin:"",hmax:"",crime:""};
const $=s=>document.querySelector(s);
const col=n=>"hsl("+([...n].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360)+" 55% 68%)";
const ini=n=>n.split(" ").map(w=>w[0]).join("");
const age=b=>Math.floor((Date.now()-new Date(b))/31557600000);
const app=$("#app");

function login(msg){
  app.innerHTML=`<div class="card login"><h1>Turkiston Shield</h1><div class="mut">Demo versiya. Barcha ma’lumotlar uydirma.</div>
  <input id="u" placeholder="Login" autocomplete="off"><input id="p" type="password" placeholder="Parol">
  <div class="err" id="e">${msg||""}</div><button class="pri" id="go">Kirish</button>
  <div class="note">Sinash uchun: <b>admin</b> / admin123 yoki <b>tergovchi</b> / tergov123</div></div>`;
  const go=()=>{const u=USERS[$("#u").value.trim()];
    if(u&&u.pw===$("#p").value){S.user=u;list();}else login("Login yoki parol notoʻgʻri.");};
  $("#go").onclick=go;$("#p").onkeydown=e=>{if(e.key==="Enter")go();};
}

function top(extra){
  return `<div class="top"><div><h2>Turkiston Shield</h2></div><div>${extra||""}<span class="badge">${S.user.name}</span> <button id="out">Chiqish</button></div></div>`;
}
function bindOut(){$("#out").onclick=()=>{S.user=null;S.sel=null;login();};}

function filtered(){
  const q=S.q.toLowerCase();
  return P.filter(p=>
    (!q||[p.name,p.id,p.phone,p.city,...p.veh.map(v=>v.p)].join(" ").toLowerCase().includes(q))&&
    (!S.city||p.city===S.city)&&
    (!S.hmin||p.h>=+S.hmin)&&(!S.hmax||p.h<=+S.hmax)&&
    (!S.crime||(S.crime==="none"?!p.cv.length:p.cv.some(c=>c.t===S.crime))));
}

function list(){
  S.sel=null;
  const cities=[...new Set(P.map(p=>p.city))].sort();
  const crimes=[...new Set(P.flatMap(p=>p.cv.map(c=>c.t)))].sort();
  app.innerHTML=top()+`<div class="card"><div class="filters">
  <input class="q" id="q" placeholder="Ism, ID, telefon yoki davlat raqami" value="${S.q}">
  <select id="city"><option value="">Barcha shaharlar</option>${cities.map(c=>`<option ${S.city===c?"selected":""}>${c}</option>`).join("")}</select>
  <select id="crime"><option value="">Sudlanganlik: hammasi</option>${crimes.map(c=>`<option ${S.crime===c?"selected":""}>${c}</option>`).join("")}<option value="none" ${S.crime==="none"?"selected":""}>Sudlanmagan</option></select>
  <input id="hmin" type="number" placeholder="Boʻy dan (sm)" value="${S.hmin}"><input id="hmax" type="number" placeholder="Boʻy gacha (sm)" value="${S.hmax}">
  </div><div class="mut" id="cnt"></div></div><div class="list" id="res"></div>
  <div class="note">Misol: Boʻy 175–180, shahar Toshkent, sudlanganlik Bosqinchilik.</div>`;
  bindOut();
  const run=()=>{
    S.q=$("#q").value;S.city=$("#city").value;S.crime=$("#crime").value;S.hmin=$("#hmin").value;S.hmax=$("#hmax").value;
    const t=performance.now(),r=filtered(),ms=(performance.now()-t).toFixed(1);
    $("#cnt").textContent=`${r.length} ta natija · ${ms} ms`;
    $("#res").innerHTML=r.length?r.map(p=>`<button class="card row" data-id="${p.id}"><span class="av" style="background:${col(p.name)}">${ini(p.name)}</span>
      <span style="flex:1"><b>${p.name}</b><br><span class="mut">${p.id} · ${p.city} · ${p.h} sm · ${p.cv.length?p.cv.length+" ta sudlanganlik":"sudlanmagan"}</span></span></button>`).join("")
      :`<div class="card mut">Hech narsa topilmadi. Filtrlarni kamaytirib koʻring.</div>`;
    document.querySelectorAll(".row").forEach(b=>b.onclick=()=>dossier(b.dataset.id));
  };
  ["q","city","crime","hmin","hmax"].forEach(i=>$("#"+i).oninput=run);
  run();
}

function dossier(id){
  const p=P.find(x=>x.id===id),adm=S.user.role==="admin";
  const hid=`<span class="hide">Yashirilgan (faqat admin)</span>`;
  app.innerHTML=top(`<button id="back">Orqaga</button> `)+`<div class="card big" style="display:flex;gap:16px;align-items:center">
  <span class="av" style="background:${col(p.name)}">${ini(p.name)}</span><div><h1>${p.name}</h1><div class="mut">${p.id} · ${age(p.born)} yosh</div></div></div>
  <div class="grid">
  <div class="card"><h3>Shaxsiy maʼlumot</h3><dl><dt>Tugʻilgan</dt><dd>${p.born}</dd><dt>Boʻy</dt><dd>${p.h} sm</dd><dt>Shahar</dt><dd>${p.city}</dd>
  <dt>Manzil</dt><dd>${p.addr}</dd><dt>Telefon</dt><dd>${adm?p.phone:hid}</dd><dt>Barmoq izi</dt><dd>${adm?p.fp:hid}</dd><dt>Alomatlar</dt><dd>${p.marks}</dd></dl></div>
  <div class="card"><h3>Sudlanganlik tarixi</h3>${p.cv.length?p.cv.map(c=>`<dl><dt>${c.y}</dt><dd><span class="tag">${c.t}</span> ${c.d}</dd></dl>`).join(""):`<p class="mut">Sudlanmagan.</p>`}</div>
  <div class="card"><h3>Transport vositalari</h3>${p.veh.length?p.veh.map(v=>`<dl><dt>${v.p}</dt><dd>${v.m}</dd></dl>`).join(""):`<p class="mut">Roʻyxatda yoʻq.</p>`}</div>
  </div><div class="note">Rol: ${S.user.role}. Tergovchi roli telefon va barmoq izini koʻrmaydi (RBAC namunasi).</div>`;
  bindOut();$("#back").onclick=list;
}
login();
</script>
</body>
</html>
